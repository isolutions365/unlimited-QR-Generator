    <script>
      // Storage Sandbox Guard: Ensure window.localStorage and window.sessionStorage never throw SecurityError in iframe sandboxes
      (function() {
        function createMemoryStorage() {
          var store = {};
          return {
            getItem: function(k) { return store.hasOwnProperty(k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }
        try {
          var tk = '__storage_guard_test__';
          window.localStorage.setItem(tk, '1');
          window.localStorage.removeItem(tk);
        } catch(e) {
          console.warn('[Sandbox Guard] localStorage blocked or throwing. Polyfilling with memory storage.');
          var mockLocal = createMemoryStorage();
          try { Object.defineProperty(window, 'localStorage', { value: mockLocal, configurable: true, writable: true }); } catch(err) {
            try { if (window.Window && window.Window.prototype) Object.defineProperty(window.Window.prototype, 'localStorage', { get: function() { return mockLocal; }, configurable: true }); } catch(e2) {}
          }
        }
        try {
          var tkS = '__session_guard_test__';
          window.sessionStorage.setItem(tkS, '1');
          window.sessionStorage.removeItem(tkS);
        } catch(e) {
          console.warn('[Sandbox Guard] sessionStorage blocked or throwing. Polyfilling with memory storage.');
          var mockSession = createMemoryStorage();
          try { Object.defineProperty(window, 'sessionStorage', { value: mockSession, configurable: true, writable: true }); } catch(err) {
            try { if (window.Window && window.Window.prototype) Object.defineProperty(window.Window.prototype, 'sessionStorage', { get: function() { return mockSession; }, configurable: true }); } catch(e2) {}
          }
        }
      })();
    </script>
    <script>
      // Global Comprehensive Error Interceptor & Diagnostic Logger
      (function() {
        window.__RUNTIME_ERROR_LOGS__ = window.__RUNTIME_ERROR_LOGS__ || [];

        function isIgnorableError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.indexOf('invalid site key') !== -1 ||
            str.indexOf('6leqa3qt') !== -1 ||
            str.indexOf('recaptcha') !== -1 ||
            str.indexOf('api.js') !== -1 ||
            str.indexOf('database is closing') !== -1 ||
            str.indexOf('closing/hidden') !== -1 ||
            str.indexOf('app-check') !== -1 ||
            str.indexOf('appcheck') !== -1 ||
            str.indexOf('play() failed') !== -1 ||
            str.indexOf('audiocontext') !== -1 ||
            str.indexOf('user didn\'t interact') !== -1 ||
            str.indexOf('resizeobserver') !== -1 ||
            str.indexOf('abort') !== -1 ||
            str.indexOf('canceled') !== -1 ||
            str.indexOf('clipboard') !== -1 ||
            str.indexOf('networkerror') !== -1 ||
            str.indexOf('firebaseerror') !== -1 ||
            str.indexOf('auth/network-request-failed') !== -1 ||
            str.indexOf('auth/popup-closed-by-user') !== -1 ||
            str.indexOf('auth/cancelled-popup-request') !== -1
          );
        }

        function categorizeError(msg, source) {
          var str = (String(msg) + ' ' + String(source)).toLowerCase();
          if (str.indexOf('cors') !== -1 || str.indexOf('access-control-allow-origin') !== -1 || str.indexOf('cross-origin') !== -1) {
            return 'CORS_POLICY_ERROR';
          }
          if (str.indexOf('mime') !== -1 || str.indexOf('strict mime type') !== -1 || str.indexOf('not a valid javascript') !== -1) {
            return 'MIME_TYPE_ERROR';
          }
          if (str.indexOf('fetch') !== -1 || str.indexOf('import') !== -1 || str.indexOf('chunk') !== -1 || str.indexOf('loading module') !== -1) {
            return 'DYNAMIC_IMPORT_FAILURE';
          }
          return 'RUNTIME_EXECUTION_ERROR';
        }

        function logDiagnosticError(category, details) {
          var logEntry = {
            timestamp: new Date().toISOString(),
            category: category,
            message: details.message || 'Unknown error',
            source: details.source || 'N/A',
            line: details.lineno || details.line || 0,
            column: details.colno || details.column || 0,
            stack: details.stack || (details.error && details.error.stack) || null,
            url: window.location.href,
            userAgent: navigator.userAgent
          };

          window.__RUNTIME_ERROR_LOGS__.push(logEntry);
          console.warn('[Runtime Diagnostic - ' + category + ']', logEntry);

          // Update loading fallback screen if present so exact runtime error path is visible
          var fallbackText = document.getElementById('app-loading-text');
          if (fallbackText && (category === 'DYNAMIC_IMPORT_FAILURE' || category === 'MIME_TYPE_ERROR' || category === 'CORS_POLICY_ERROR')) {
            fallbackText.innerHTML = '<span style="color:#dc2626; font-weight:700;">' + category + ':</span> ' +
              (logEntry.message.length > 150 ? logEntry.message.substring(0, 150) + '...' : logEntry.message) +
              '<br/><span style="font-size:11px; color:#64748b;">Source: ' + logEntry.source + ' (' + logEntry.line + ':' + logEntry.column + ')</span>';
          }
        }

        // 1. Comprehensive window.onerror handler
        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || '');
          if (isIgnorableError(msg)) {
            console.warn('[Global Interceptor] Handled background notice via onerror:', message);
            return true;
          }

          var category = categorizeError(msg, source);
          logDiagnosticError(category, {
            message: msg,
            source: source,
            lineno: lineno,
            colno: colno,
            error: error
          });

          if (originalOnError) {
            try { return originalOnError.apply(this, arguments); } catch(e) {}
          }
          return false;
        };

        // 2. Comprehensive unhandledrejection handler (captures dynamic import & async promise rejections)
        window.addEventListener('unhandledrejection', function(e) {
          var reasonMsg = '';
          var stack = null;
          if (e && e.reason) {
            reasonMsg = e.reason.message || String(e.reason);
            stack = e.reason.stack || null;
          }
          if (isIgnorableError(reasonMsg)) {
            console.warn('[Global Interceptor] Handled background rejection:', reasonMsg);
            if (e && e.preventDefault) e.preventDefault();
            return;
          }

          var category = categorizeError(reasonMsg, '');
          logDiagnosticError(category === 'RUNTIME_EXECUTION_ERROR' ? 'UNHANDLED_REJECTION' : category, {
            message: reasonMsg,
            source: 'Promise Rejection',
            stack: stack,
            error: e.reason
          });

          // Prevent unhandled rejection propagation for benign or non-fatal async background calls
          if (e && e.preventDefault) {
            e.preventDefault();
          }
        });

        // 3. Capture asset script & stylesheet load failures (CORS, 404, MIME errors on tags)
        window.addEventListener('error', function(e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var src = e.target.src || e.target.href || '';
            if (isIgnorableError(src)) return;

            var category = 'RESOURCE_LOAD_FAILURE';
            logDiagnosticError(category, {
              message: 'Failed to load ' + e.target.tagName.toLowerCase() + ' resource: ' + src,
              source: src,
              lineno: 0,
              colno: 0
            });
          }
        }, true);
      })();
    </script>
    <script>
      // Enhanced ServiceWorker & Cache Auto-Cleanup to resolve stale bundle and intermittent blank-screen issues
      (function() {
        window.clearAppCacheAndSW = function() {
          return new Promise(function(resolve) {
            var promises = [];
            if ('serviceWorker' in navigator) {
              promises.push(
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  var unregs = [];
                  for (var i = 0; i < registrations.length; i++) {
                    unregs.push(registrations[i].unregister());
                  }
                  return Promise.all(unregs);
                }).catch(function(err) {
                  console.warn('[SW Cleanup] Unregister warning:', err);
                })
              );
            }

            if ('caches' in window) {
              promises.push(
                caches.keys().then(function(names) {
                  var dels = [];
                  for (var i = 0; i < names.length; i++) {
                    dels.push(caches.delete(names[i]));
                  }
                  return Promise.all(dels);
                }).catch(function(err) {
                  console.warn('[Cache Cleanup] Warning:', err);
                })
              );
            }

            Promise.all(promises).then(function() {
              console.log('[Cache Cleanup] Successfully unregistered ServiceWorkers and purged Cache Storage.');
              resolve(true);
            }).catch(function() {
              resolve(false);
            });
          });
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function(err) {
            console.warn('[SW Cleanup] Unregister warning:', err);
          });
        }

        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function(err) {
            console.warn('[Cache Cleanup] Warning:', err);
          });
        }

        // Early script load failure detection to bust stale browser cache
        window.addEventListener('error', function(e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var src = e.target.src || e.target.href || '';
            if (src.indexOf('/src/') !== -1 || src.indexOf('/assets/') !== -1) {
              console.warn('[Cache Buster] Detected asset loading error:', src);
              var reloadAttemptKey = 'app_chunk_reload_timestamp';
              var lastReload = sessionStorage.getItem(reloadAttemptKey);
              var now = Date.now();
              if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
                sessionStorage.setItem(reloadAttemptKey, now.toString());
                window.location.reload(true);
              }
            }
          }
        }, true);
      })();
    </script>

    <script>
      // Immediate auto-dismiss timer to ensure static loading fallback is NEVER stuck on screen
      (function() {
        function removeFallback() {
          var fb = document.getElementById('app-loading-fallback');
          if (fb && fb.parentNode) {
            fb.parentNode.removeChild(fb);
          }
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(removeFallback, 800);
        } else {
          document.addEventListener('DOMContentLoaded', function() { setTimeout(removeFallback, 800); });
          window.addEventListener('load', function() { setTimeout(removeFallback, 500); });
        }
        setTimeout(removeFallback, 1500);
      })();
    </script>
