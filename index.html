    <script>
      // Global Interceptor to prevent reCAPTCHA / App Check key-validation domain restrictions and background rejections from causing unhandled exceptions
      (function() {
        function isIgnorableError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.indexOf('invalid site key') !== -1 ||
            str.indexOf('6leqa3qt') !== -1 ||
            str.indexOf('recaptcha') !== -1 ||
            str.indexOf('api.js') !== -1 ||
            str.indexOf('database is closing') !== -1 ||
            str.indexOf('closing/hidden') !== -1 ||
            str.indexOf('app-check') !== -1 ||
            str.indexOf('appcheck') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          if (isIgnorableError(msg)) {
            console.warn('[Global Interceptor] Handled background error gracefully:', msg);
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
          }
        }, true);

        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || '');
          if (isIgnorableError(msg)) {
            console.warn('[Global Interceptor] Handled background error via onerror:', message);
            return true;
          }
          if (originalOnError) {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = '';
          if (e && e.reason) {
            reason = e.reason.message || String(e.reason);
          }
          console.warn('[Global Interceptor] Silenced unhandled rejection:', reason);
          if (e && e.preventDefault) {
            e.preventDefault();
          }
          if (e && e.stopPropagation) {
            e.stopPropagation();
          }
        });
      })();
    </script>
    <script>
      // Enhanced ServiceWorker & Cache Auto-Cleanup to resolve stale bundle and intermittent blank-screen issues
      (function() {
        window.clearAppCacheAndSW = function() {
          return new Promise(function(resolve) {
            var promises = [];
            if ('serviceWorker' in navigator) {
              promises.push(
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  var unregs = [];
                  for (var i = 0; i < registrations.length; i++) {
                    unregs.push(registrations[i].unregister());
                  }
                  return Promise.all(unregs);
                }).catch(function(err) {
                  console.warn('[SW Cleanup] Unregister warning:', err);
                })
              );
            }

            if ('caches' in window) {
              promises.push(
                caches.keys().then(function(names) {
                  var dels = [];
                  for (var i = 0; i < names.length; i++) {
                    dels.push(caches.delete(names[i]));
                  }
                  return Promise.all(dels);
                }).catch(function(err) {
                  console.warn('[Cache Cleanup] Warning:', err);
                })
              );
            }

            Promise.all(promises).then(function() {
              console.log('[Cache Cleanup] Successfully unregistered ServiceWorkers and purged Cache Storage.');
              resolve(true);
            }).catch(function() {
              resolve(false);
            });
          });
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function(err) {
            console.warn('[SW Cleanup] Unregister warning:', err);
          });
        }

        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function(err) {
            console.warn('[Cache Cleanup] Warning:', err);
          });
        }

        // Early script load failure detection to bust stale browser cache
        window.addEventListener('error', function(e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var src = e.target.src || e.target.href || '';
            if (src.indexOf('/src/') !== -1 || src.indexOf('/assets/') !== -1) {
              console.warn('[Cache Buster] Detected asset loading error:', src);
              var reloadAttemptKey = 'app_chunk_reload_timestamp';
              var lastReload = sessionStorage.getItem(reloadAttemptKey);
              var now = Date.now();
              if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
                sessionStorage.setItem(reloadAttemptKey, now.toString());
                window.location.reload(true);
              }
            }
          }
        }, true);
      })();
    </script>
